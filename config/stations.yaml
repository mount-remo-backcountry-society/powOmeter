    source: {avalanche_canada_id: 57, pcds_native_id: "52325"}
    enabled: true
    publish: true
    licence: "Data courtesy of the BC Ministry of Transportation & Infrastructure, used with permission; not covered by CC BY 4.0. The Ministry is not liable for these data or any use of them."
    permission: docs/permissions/moti-2026-10.md

  - id: avcan_58
    name: Shames (bottom of the hill)
    operator: BC Ministry of Transportation & Infrastructure
