# Stations whose data this repository processes.
# type   = which decoder reads it (one module per type in powometer/decoders/)
# publish = whether its values may appear in published files and on the site
#
# enabled = whether `fetch` collects it and `build` processes it
# permission = for data owned by others: the file in docs/permissions/ that
#   records the owner's written permission. `validate` refuses to enable or
#   publish such a station without it (CLAUDE.md rule 3).
#
# The BC Ministry of Transportation & Infrastructure (MoTI) observations are
# "Access Only": reproduction needs written permission (design §10). To switch
# a MoTI station on: file the permission in docs/permissions/, set
# `permission` to that file, update `licence` to the permission's terms, then
# set enabled and publish to true.

stations:
  - id: powometer
    name: POW-O-METER
    operator: Mount Remo Backcountry Society
    type: powometer
    enabled: true
    publish: true
    licence: CC-BY-4.0

  - id: avcan_56
    name: Kasiks High
    operator: BC Ministry of Transportation & Infrastructure
    type: avalanche_canada
    source: {avalanche_canada_id: 56, pcds_native_id: "52322"}
    enabled: false
    publish: false
    licence: "Access Only (BC MoTI); permission requested 2026-10"
    permission: null

  - id: avcan_57
    name: Kasiks Low
    operator: BC Ministry of Transportation & Infrastructure
    type: avalanche_canada
    source: {avalanche_canada_id: 57, pcds_native_id: "52325"}
    enabled: false
    publish: false
    licence: "Access Only (BC MoTI); permission requested 2026-10"
    permission: null

  - id: avcan_58
    name: Shames (bottom of the hill)
    operator: BC Ministry of Transportation & Infrastructure
    type: avalanche_canada
    source: {avalanche_canada_id: 58}
    enabled: false
    publish: false
    licence: "Access Only (BC MoTI); permission requested 2026-10"
    permission: null
