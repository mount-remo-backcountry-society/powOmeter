# Site visits: what was OBSERVED and DONE. One entry per visit.
# Readings inside `disturbed` (UTC) are labelled `site_visit` (quality suspect)
# because people were at the station. People are recorded by initials only
# (this repository is public).
#
# For a new visit, record at least: date, who, disturbed window (start and
# end, UTC), whether the sensor was re-mounted, the snow depth probed under
# the sensor, and (if the ground is bare) a tape measurement sensor-to-ground.
# A re-mount also needs a new entry in mounts.yaml.

visits:
  - date: 2025-01-26
    who: JK
    work: [installation]
    remount: true
    probed_snow_depth_m: 1.5
    notes: "Sensor 2.6 m above snow + 1.5 m probed = 4.10 m offset (about 0.4 m too small, see mounts.yaml M1)."

  - date: 2025-01-31
    who: JK
    work: [sd_download]
    remount: false

  - date: 2025-02-07
    who: JK
    work: [sd_download, maintenance]
    remount: false
    disturbed: {from: 2025-02-07T18:20:00Z, until: 2025-02-07T19:45:00Z}
    notes: "Station power-cycled repeatedly: about 120 readings logged in an hour (frozen-clock period)."

  - date: 2025-02-17
    who: JK
    work: [sd_download]
    remount: false

  - date: 2025-07-06
    who: JK
    work: [sd_download]
    remount: false

  - date: 2025-09-28
    who: JK
    work: [sd_download, remount]
