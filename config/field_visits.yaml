  - date: 2025-09-30
    who: JK
    work: [sd_download]
    remount: false
    notes: "Field-tab offset set to 4.45 m."

  - date: 2025-10-12
    who: JK
    work: [sd_download]
    remount: false

  - date: 2025-10-17
    who: JK
    work: [sd_download]
    remount: false

  - date: 2025-12-30
    who: JK
    work: [sd_download]
    remount: unknown
    notes: "Logging gap before this visit, probably a station issue."

  - date: 2026-01-16
    who: JK
    work: [sd_download]
    remount: false

  - date: 2026-01-23
    who: JK
