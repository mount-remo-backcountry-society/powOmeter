# Manual corrections: an ordered list of operations applied to the data
# after automatic quality control. Raw data is never changed.
#
# Each entry needs: id, op, station, variable (or "all"), a target
# (message: transmit time of one satellite message, or from/until: a UTC
# window), reason, by (initials) and date.
#
# op: delete        value kept but marked quality "poor" (excluded from best.csv)
#     spike_filter  params: {max_step, window}
#     threshold     params: {min, max}
#     gap_fill      params: {max_gap}
#     offset        params: {value}          (added to the value)
#     drift         params: {start, end}     (linear, added from 'from' to 'until')
# Units follow the variable (snow depth in cm).

corrections:
