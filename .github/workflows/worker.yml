name: worker

# The intake Worker on Cloudflare (worker/): tests on every change to it,
# and deploys it when the change reaches main (or by hand from the Actions
# tab). Deploying needs two repository secrets, CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (OPERATIONS.md); without them only the tests run.
# The Worker's own secrets (IMEI, read key, GitHub key) live in Cloudflare
# and are kept across deploys.

on:
  push:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  pull_request:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test the Worker
        working-directory: worker
        run: node --test

  deploy:
    needs: test
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check the deploy settings
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice::Not deployed: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (OPERATIONS.md)"
          elif grep -q 'id = "SET-ME"' worker/wrangler.toml; then
            echo "::notice::Not deployed: the mailbox id in worker/wrangler.toml is not set yet (OPERATIONS.md)"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.ready.outputs.ok
        with:
          node-version: "22"
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.ok
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4.145.0"
