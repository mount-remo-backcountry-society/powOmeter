name: publish

# Fetch new satellite messages and nearby-station readings, rebuild, add
# the newest webcam frames, publish the station page and files, and
# open/close alarm Issues (design §6.7, phases 2-3).
#
# Started by the intake Worker on Cloudflare (worker/) every 10 minutes and
# when a satellite message arrives, by hand from the Actions tab, and by
# GitHub's own schedule as a backup. That schedule alone is not enough: set
# to hourly or to every 5 minutes, GitHub ran it only about every 2-5 hours
# (Oct 2026). Actions minutes and Pages are free
# only because the repository is public: it must stay public.

on:
  workflow_dispatch:
    inputs:
      inject_alarm:
        description: "Test only: text of a fake alarm. It opens an Issue; the next normal run closes it"
        required: false
        default: ""
  schedule:
    - cron: "2-59/5 * * * *"      # :02, :07 ... :57

permissions:
  contents: write     # commit new raw messages
  issues: write       # alarm Issues
  pages: write        # deploy
  id-token: write     # deploy

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04       # pinned: ubuntu-latest changes under us (Ubuntu 26 from 2026-10-19)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Fetch new satellite messages and nearby-station readings
        env:
          MAILBOX_URL: ${{ secrets.MAILBOX_URL }}
          MAILBOX_READ_KEY: ${{ secrets.MAILBOX_READ_KEY }}
          MESSAGES_CSV_URL: ${{ secrets.MESSAGES_CSV_URL }}
        run: python -m powometer fetch

      - name: Save new raw messages to the repository
        run: |
          git add raw/radio/messages_tab
          if [ -d raw/radio/worker ]; then git add raw/radio/worker; fi
          if [ -d raw/avcan ]; then git add raw/avcan; fi
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            python tools/privacy_check.py --staged
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Fetch satellite messages"
            git pull -q --rebase
            git push -q
          fi

      - name: Check config
        run: python -m powometer validate

      - name: Build
        env:
          INJECT_ALARM: ${{ inputs.inject_alarm }}
        run: python -m powometer build

      - name: Add the station page
        run: cp -r site/. out/

      # Webcam time lapse: frames live only in the published site and in this
      # cache between runs, never in git. Nothing here can stop publishing.
      - name: Restore webcam frames
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: out/webcams
          key: webcams-${{ github.run_id }}
          restore-keys: webcams-
      - name: Add the newest webcam frames
        continue-on-error: true
        timeout-minutes: 5
        run: python -m powometer webcams out/webcams
      - name: Save webcam frames
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: out/webcams
          key: webcams-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Open and close alarm Issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/alarm_issues.py out/v1/status.json

  deploy:
    needs: build
    # Pages needs a public repository on GitHub's free plan
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
